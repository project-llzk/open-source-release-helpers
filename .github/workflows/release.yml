name: Release

on:
  workflow_call:
    inputs:
      release_pr_number:
        description: "The merged release PR number"
        required: true
        type: number
    outputs:
      status:
        description: "The status of the release"
        value: ${{ jobs.release.outputs.status }}
      version:
        description: "The version that was released"
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.status-check.outputs.status }}
      version: ${{ steps.release_pr.outputs.version }}
    steps:
      - name: Locate release PR metadata
        id: release_pr
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.RELEASE_APPROVER }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ inputs.release_pr_number }}');
            const versionPattern = /^v[0-9]+\.[0-9]+\.[0-9]+$/;

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            if (!pull.merged) {
              core.setFailed(`Release PR #${prNumber} has not been merged.`);
              return;
            }

            if (pull.base.ref !== 'main') {
              core.setFailed(`Release PR #${prNumber} targets '${pull.base.ref}', expected 'main'.`);
              return;
            }

            if (!pull.merge_commit_sha) {
              core.setFailed(`Release PR #${prNumber} does not have a merge commit SHA.`);
              return;
            }

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number: prNumber
            });
            const labelNames = labels.map((label) => label.name);

            if (!labelNames.includes('release')) {
              core.setFailed(`Release PR #${prNumber} is missing the 'release' label.`);
              return;
            }

            const versionLabels = labelNames.filter((label) => versionPattern.test(label));
            if (versionLabels.length !== 1) {
              core.setFailed(`Release PR #${prNumber} must have exactly one version label like 'v1.2.3'. Found: ${versionLabels.join(', ') || 'none'}.`);
              return;
            }

            const version = versionLabels[0];
            const expectedTitle = `Release ${version}`;
            if (pull.title !== expectedTitle) {
              core.setFailed(`Release PR #${prNumber} title must be '${expectedTitle}', found '${pull.title}'.`);
              return;
            }

            core.exportVariable('RELEASE_VERSION', version);
            core.exportVariable('RELEASE_COMMIT', pull.merge_commit_sha);
            core.setOutput('version', version);
            core.setOutput('commit', pull.merge_commit_sha);
            core.setOutput('url', pull.html_url);

      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_pr.outputs.commit }}
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.RELEASE_APPROVER }}
          persist-credentials: false

      - name: Check out release helper code
        uses: actions/checkout@v6
        with:
          # ${{ github.action_repository }} ends up pointing to actions/checkout
          repository: project-llzk/open-source-release-helpers
          path: release_helpers
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip" # caching pip dependencies

      - name: Install release helpers python dependencies
        run: |
          pip install --upgrade pip && pip install -r $GITHUB_WORKSPACE/release_helpers/requirements.txt

      - name: Extract release changelog
        run: |
          mdsplit CHANGELOG.md --max-level 2 -o releaseJournal
          RELEASE_CHANGES=$(find releaseJournal -name "*${RELEASE_VERSION}*" -print -quit)
          if [ -z "${RELEASE_CHANGES}" ]; then
            echo "Could not locate changelog section for ${RELEASE_VERSION}."
            exit 1
          fi
          echo "RELEASE_CHANGES=${RELEASE_CHANGES}" >> $GITHUB_ENV

      - name: release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_pr.outputs.version }}
          bodyFile: ${{ env.RELEASE_CHANGES }}
          commit: ${{ steps.release_pr.outputs.commit }}
          token: ${{ secrets.RELEASE_APPROVER }}
          skipIfReleaseExists: true # make idempotent in case of retries

      - name: Set release status
        id: status-check
        run: echo "status=success" >> $GITHUB_OUTPUT

      - name: Write success summary
        run: |
          echo "================================
                Release **${{ env.RELEASE_VERSION }}** created successfully.

                * [Release ${{ env.RELEASE_VERSION }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE_VERSION }})

                ==================================" | sed 's/^[[:space:]]*//g' >> $GITHUB_STEP_SUMMARY

      - name: Write failure summary
        if: failure()
        run: |
          echo "==================================
                ERROR: Failed to create release ${{ env.RELEASE_VERSION }}.
                Check action output and/or contact @project-llzk/maintainers team for clarifications.

                ==================================" | sed 's/^[[:space:]]*//g' >> $GITHUB_STEP_SUMMARY
